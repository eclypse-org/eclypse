name: Build and Deploy to PyPI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Build wheel
        run: |
          uv build --wheel --clear --no-create-gitignore

      - name: Verify distribution
        run: |
          uvx twine check --strict dist/*

      - name: Install the wheel in a clean environment
        run: |
          uv venv "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke" dist/*.whl
          "$RUNNER_TEMP/smoke/bin/python" -c "import eclypse"

      - name: Upload distribution
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  lint:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Run pre-commit hooks
        run: |
          uv run --locked --only-group dev pre-commit run --all-files

  tests:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/tests.yaml
    secrets: inherit

  deploy:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, lint, tests]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Download distribution
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Upload to PyPI
        run: |
          uv publish -v --trusted-publishing always

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # this version's section of the changelog, without its heading
          awk -v v="$GITHUB_REF_NAME" '
            /^## / { found = ($2 == v); next }
            found
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.whl \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
