name: Run docs tests

on:
  push:
    branches:
      - main
    paths:
      - "docs/_static/js/**"
      - "tests/docs/**"
      - ".github/workflows/docs_tests.yaml"
  pull_request:
    paths:
      - "docs/_static/js/**"
      - "tests/docs/**"
      - ".github/workflows/docs_tests.yaml"

concurrency:
  group: docs-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tests
        run: |
          node --test tests/docs/*.test.cjs
