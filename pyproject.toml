[project]
name = "eclypse"
version = "0.9.0"
description = "an Edge-CLoud pYthon Platform for Simulated runtime Environments"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license-files = ["LICENSE"]

authors = [
    { name = "Jacopo Massa", email = "jacopo.massa@di.unipi.it" },
    { name = "Valerio De Caro", email = "valerio.decaro@di.unipi.it" },
]

maintainers = [
    { name = "Jacopo Massa", email = "jacopo.massa@di.unipi.it" },
    { name = "Valerio De Caro", email = "valerio.decaro@di.unipi.it" },
]

dependencies = [
    "aiofiles>=25.1.0",
    "pandas>=3.0.5",
    "loguru>=0.7.3",
    "networkx>=3.6.1",
]

[project.urls]
Homepage = "https://github.com/eclypse-org/eclypse"
Repository = "https://github.com/eclypse-org/eclypse"


# Dependency Groups
[dependency-groups]
dev = [
    "commitizen>=4.18.0",
    "isort>=9.0.0",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.4",
]

deploy = [
    "twine>=7.0.0",
]

test = [
    "polars>=1.44.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ray[default]>=2.58.0",
    "tensorboardx>=2.6.5",
    "topohub>=1.5.1",
]

docs = [
    "docformatter[tomli]>=1.7.8",
    "jinja2>=3.1.6",
    "myst-parser>=5.1.0",
    "pydata-sphinx-theme>=0.21.0",
    "sphinx>=9.0.4",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.7.0",
    "sphinx-favicon>=1.1.0",
    "sphinx-icon>=0.2.2",
]

# Build backend
[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."
module-name = "eclypse"

[project.scripts]
echo = "examples.echo.main:main"
grid-analysis = "examples.grid_analysis.main:main"
image-prediction = "examples.image_prediction.main:main"
io-round-trip = "examples.io_round_trip.main:main"
off-the-shelf = "examples.off_the_shelf.main:main"
sock-shop-mpi = "examples.sock_shop.mpi:main"
sock-shop-rest = "examples.sock_shop.rest:main"
user-distribution = "examples.user_distribution.main:main"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true


# -------------------------
# Third-party tool settings
# -------------------------

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.9.0"
tag_format = "$version"
version_files = [
    "pyproject.toml:^version",
    "eclypse/__init__.py:__version__",
    "CITATION.cff:version",
]


[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 2
filter_files = true
skip = ["__init__.py"]

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = [
    "ray",
    "ray.*",
    "polars",
    "polars.*",
    "tensorboardX",
    "networkx",
    "networkx.*",
    "pandas",
    "pandas.*",
    "numpy",
    "numpy.*",
    "loguru",
    "loguru.*",
]
ignore_missing_imports = true

# --------------------------
# Pytest and Coverage settings
# --------------------------

#

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=eclypse --cov-report=xml --cov-report=term-missing -n auto"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
markers = [
    "integration: end-to-end integration tests",
    "emulation: ray-backed remote integration tests",
    "optional: tests that exercise optional dependencies",
]

[tool.coverage.run]
branch = true
source = ["eclypse"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
]
