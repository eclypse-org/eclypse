[project]
name = "eclypse"
version = "0.9.1"
description = "an Edge-CLoud pYthon Platform for Simulated runtime Environments"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

authors = [
    { name = "Jacopo Massa", email = "jacopo.massa@di.unipi.it" },
    { name = "Valerio De Caro", email = "valerio@valeriodecaro.com" },
]

maintainers = [
    { name = "Jacopo Massa", email = "jacopo.massa@di.unipi.it" },
    { name = "Valerio De Caro", email = "valerio@valeriodecaro.com" },
]

dependencies = [
    "aiofiles>=25.1.0",
    "loguru>=0.7.3",
    "networkx>=3.6.1; python_version < '3.12'",
    "networkx>=3.6.1,<3.7; python_full_version == '3.14.1'",
    "networkx>=3.7; python_version >= '3.12' and python_full_version != '3.14.1'",
    "pandas>=3.1.0",
]

[project.urls]
Homepage = "https://github.com/eclypse-org/eclypse"
Repository = "https://github.com/eclypse-org/eclypse"
Documentation = "https://eclypse.readthedocs.io/en/latest/"
Changelog = "https://github.com/eclypse-org/eclypse/blob/main/CHANGELOG.md"


# Dependency Groups
[dependency-groups]
dev = [
    "commitizen>=4.19.3",
    "isort>=9.0.2",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "ruff>=0.17.2",
]

deploy = ["twine>=7.0.0"]

test = [
    "polars>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ray[default]>=2.59.0",
    "tensorboardx>=2.6.5",
    "topohub>=1.5.1",
]

docs = [
    "docformatter[tomli]>=1.7.8",
    "jinja2>=3.1.6",
    "myst-parser>=5.1.0",
    "pydata-sphinx-theme>=0.23.0",
    "sphinx>=9.0.4; python_version < '3.12'",
    "sphinx>=9.1.1; python_version >= '3.12' and python_version < '3.13'",
    "sphinx>=9.2.0; python_version >= '3.13'",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.7.0",
    "sphinx-favicon>=1.1.0",
    "sphinx-icon>=0.2.2",
]

# Build backend
[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."
module-name = "eclypse"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true


# -------------------------
# Third-party tool settings
# -------------------------

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "$version"
version_files = [
    "pyproject.toml:^version",
    "eclypse/__init__.py:__version__",
    "CITATION.cff:version",
]


[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 2
filter_files = true
skip = ["__init__.py"]

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = [
    "ray",
    "ray.*",
    "polars",
    "polars.*",
    "tensorboardX",
    "networkx",
    "networkx.*",
    "pandas",
    "pandas.*",
    "numpy",
    "numpy.*",
    "loguru",
    "loguru.*",
]
ignore_missing_imports = true

# --------------------------
# Pytest and Coverage settings
# --------------------------

#

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=eclypse --cov-report=xml --cov-report=term-missing -n auto"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
markers = [
    "integration: end-to-end integration tests",
    "emulation: ray-backed remote integration tests",
    "optional: tests that exercise optional dependencies",
]

[tool.coverage.run]
branch = true
source = ["eclypse"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
]
