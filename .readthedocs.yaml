version: 2

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.11"
  jobs:
    build:
      html:
        - >-
          uv run --no-sync --no-dev
          make -C docs html
          BUILDDIR="$READTHEDOCS_OUTPUT"
          O="-T --keep-going -D language=en"

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
