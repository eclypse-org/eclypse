version: 2

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.11"
  jobs:
    build:
      html:
        - uv run --no-sync --no-dev zensical build --strict
    post_build:
      - mkdir -p "$READTHEDOCS_OUTPUT/html/"
      - cp -r site/. "$READTHEDOCS_OUTPUT/html/"

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs
